<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 230" width="285" height="230">
  <defs>
    <!-- Background: Soft mint-tinted luxury light gradient tailored for white cards -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fdfa" />
      <stop offset="50%" stop-color="#eff7f2" />
      <stop offset="100%" stop-color="#e3f0e8" />
    </linearGradient>

    <!-- 3D Calendar Body Gradient -->
    <linearGradient id="calBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f4f7f5" />
      <stop offset="100%" stop-color="#d9e6de" />
    </linearGradient>

    <!-- Calendar Top Bar (Vibrant Deep Teal) -->
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#006966" />
      <stop offset="100%" stop-color="#004B49" />
    </linearGradient>

    <!-- 3D Gold Palm / Sun Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- 3D Cyan Vacation Badge -->
    <linearGradient id="cyanBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 3D Emerald Approval Badge -->
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#1f3b28" flood-opacity="0.14" />
    </filter>
    <filter id="glowSubtle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="285" height="230" fill="url(#bgGrad)" rx="16" />

  <!-- Floating Ambient 3D Glass Orbs -->
  <circle cx="50" cy="55" r="14" fill="#ffffff" opacity="0.8" filter="url(#shadow3d)" />
  <circle cx="235" cy="48" r="18" fill="#fde047" opacity="0.4" filter="url(#shadow3d)" />
  <circle cx="245" cy="170" r="12" fill="#38bdf8" opacity="0.25" />

  <!-- Main 3D Floating Calendar -->
  <g filter="url(#shadow3d)" transform="translate(68, 42)">
    <!-- Calendar 3D Shadow Base -->
    <rect x="0" y="0" width="148" height="136" rx="24" fill="url(#calBody)" />
    
    <!-- Calendar Top Header Strip -->
    <path d="M 0 24 C 0 10.7 10.7 0 24 0 L 124 0 C 137.3 0 148 10.7 148 24 L 148 42 L 0 42 Z" fill="url(#calHeader)" />

    <!-- Calendar Rings (Silver 3D pegs) -->
    <rect x="34" y="-8" width="12" height="20" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="102" y="-8" width="12" height="20" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Calendar Month Dots -->
    <circle cx="50" cy="21" r="3" fill="#ffffff" opacity="0.85" />
    <circle cx="62" cy="21" r="3" fill="#ffffff" opacity="0.85" />
    <circle cx="74" cy="21" r="3" fill="#ffffff" opacity="0.85" />
    <circle cx="86" cy="21" r="3" fill="#ffffff" opacity="0.85" />
    <circle cx="98" cy="21" r="3" fill="#ffffff" opacity="0.85" />

    <!-- Calendar Grid Lines / Days (3D clay rounded bars) -->
    <rect x="22" y="58" width="22" height="14" rx="4" fill="#e2e8f0" />
    <rect x="52" y="58" width="22" height="14" rx="4" fill="#e2e8f0" />
    <rect x="82" y="58" width="22" height="14" rx="4" fill="#e2e8f0" />
    <rect x="112" y="58" width="16" height="14" rx="4" fill="#e2e8f0" />

    <rect x="22" y="80" width="22" height="14" rx="4" fill="#e2e8f0" />
    <rect x="52" y="80" width="44" height="14" rx="4" fill="#E5EAEA" />
    <rect x="104" y="80" width="24" height="14" rx="4" fill="#e2e8f0" />

    <!-- Highlighted Approved Vacation Day (Green Check Pill) -->
    <rect x="42" y="102" width="64" height="20" rx="10" fill="url(#greenBadge)" />
    <path d="M 66 112 L 71 117 L 82 107" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 3D Floating Vacation Airplane (Top Left Drift) -->
  <g filter="url(#shadow3d)" transform="translate(32, 70) rotate(-18)">
    <circle cx="20" cy="20" r="22" fill="url(#cyanBadge)" />
    <path d="M 20 8 L 24 16 L 33 19 L 24 22 L 20 30 L 16 22 L 7 19 L 16 16 Z" fill="#ffffff" />
  </g>

  <!-- 3D Floating Tropical Sun / Holiday Palm Badge (Right Side) -->
  <g filter="url(#shadow3d)" transform="translate(196, 95) rotate(14)">
    <circle cx="24" cy="24" r="24" fill="url(#goldGrad)" />
    <path d="M 24 12 L 28 20 L 37 24 L 28 28 L 24 36 L 20 28 L 11 24 L 20 20 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="24" cy="24" r="5" fill="#f59e0b" />
  </g>
</svg>
