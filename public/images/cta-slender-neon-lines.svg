<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Smooth vertical falloff mask: lines never touch the bottom border -->
    <linearGradient id="vertFalloff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="74%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="84%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="falloffMask">
      <rect x="0" y="0" width="1600" height="600" fill="url(#vertFalloff)" />
    </mask>

    <!-- Gaussian blur filters for delicate neon halo -->
    <filter id="lineBlurSoft" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
    <filter id="lineBlurWide" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <!-- Soft ambient right-side radiant bloom -->
    <radialGradient id="slenderAmbientBloom" cx="76%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff3399" stop-opacity="0.14" />
      <stop offset="42%" stop-color="#db2777" stop-opacity="0.07" />
      <stop offset="80%" stop-color="#9d174d" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Soft ambient backing bloom -->
  <rect x="700" y="0" width="900" height="600" fill="url(#slenderAmbientBloom)" />

