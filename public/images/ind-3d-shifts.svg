<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285 230" width="285" height="230">
  <defs>
    <!-- Background: Soft luxury light gradient tailored for white cards -->
    <linearGradient id="shiftBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf8fb" />
      <stop offset="50%" stop-color="#f5eef6" />
      <stop offset="100%" stop-color="#ebe0ee" />
    </linearGradient>

    <!-- 3D Dial Body Gradient (Crisp Ceramic White with Drop Depth) -->
    <linearGradient id="clockBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f6f3fa" />
      <stop offset="100%" stop-color="#ded4ec" />
    </linearGradient>

    <!-- 3D Bezel Rim (Polished Rose Gold) -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#802B5B" />
    </linearGradient>

    <!-- Inner Dial Face (Soft Pastel Shift Ring) -->
    <linearGradient id="innerDial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede8f8" />
    </linearGradient>

    <!-- Shift Arc Gradients -->
    <!-- Day Shift: Golden Amber -->
    <linearGradient id="dayShiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Evening Shift: Brand Plum / Rose -->
    <linearGradient id="eveShiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#802B5B" />
    </linearGradient>

    <!-- Night Shift: Deep Indigo Violet -->
    <linearGradient id="nightShiftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- 3D 24/7 Pill Badge -->
    <linearGradient id="pill247" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#802B5B" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- 3D Split Shift Pill Badge -->
    <linearGradient id="pillSplit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shiftShadow3d" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#551a3a" flood-opacity="0.14" />
    </filter>
    <filter id="badgeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2a0d1d" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="285" height="230" fill="url(#shiftBgGrad)" rx="16" />

  <!-- Floating Ambient 3D Glass Orbs -->
  <circle cx="46" cy="50" r="15" fill="#ffffff" opacity="0.8" filter="url(#shiftShadow3d)" />
  <circle cx="236" cy="45" r="16" fill="#fde047" opacity="0.35" filter="url(#shiftShadow3d)" />
  <circle cx="242" cy="172" r="12" fill="#802B5B" opacity="0.1" />
  <circle cx="48" cy="178" r="9" fill="#802B5B" opacity="0.08" />

  <!-- Main 3D Floating Clock / Shift Dial -->
  <g filter="url(#shiftShadow3d)" transform="translate(142, 115)">
    <!-- Outer 3D Bezel Rim -->
    <circle cx="0" cy="0" r="68" fill="url(#bezelGrad)" />
    <!-- Main Clock Ceramic White Body -->
    <circle cx="0" cy="0" r="64" fill="url(#clockBody)" />
    <!-- Inner Dial Face -->
    <circle cx="0" cy="0" r="54" fill="url(#innerDial)" />

    <!-- 24/7 Multi-Shift Segment Arcs -->
    <!-- Morning Shift Arc (120 deg) -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#dayShiftGrad)" stroke-width="7" stroke-dasharray="80 220" stroke-dashoffset="0" stroke-linecap="round" />
    <!-- Evening Shift Arc (100 deg) -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#eveShiftGrad)" stroke-width="7" stroke-dasharray="70 230" stroke-dashoffset="-90" stroke-linecap="round" />
    <!-- Night Shift Arc (90 deg) -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#nightShiftGrad)" stroke-width="7" stroke-dasharray="65 235" stroke-dashoffset="-170" stroke-linecap="round" />

    <!-- Dial Tick Marks -->
    <line x1="0" y1="-50" x2="0" y2="-44" stroke="#a49eb5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="50" y1="0" x2="44" y2="0" stroke="#a49eb5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="50" x2="0" y2="44" stroke="#a49eb5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-50" y1="0" x2="-44" y2="0" stroke="#a49eb5" stroke-width="2.5" stroke-linecap="round" />

    <!-- Clock Center Hub & Hands -->
    <!-- Hour Hand pointing to 10 o'clock -->
    <line x1="0" y1="0" x2="-18" y2="-22" stroke="#1f1838" stroke-width="4.5" stroke-linecap="round" />
    <!-- Minute Hand pointing to 2 o'clock -->
    <line x1="0" y1="0" x2="26" y2="-15" stroke="#802B5B" stroke-width="3" stroke-linecap="round" />
    <!-- Second Hand (Rose accent) -->
    <line x1="-6" y1="8" x2="28" y2="-36" stroke="#e11d48" stroke-width="1.5" stroke-linecap="round" />
    <!-- Center 3D Pin -->
    <circle cx="0" cy="0" r="5" fill="#1f1838" />
    <circle cx="0" cy="0" r="2.5" fill="#fde047" />

    <!-- Rotational Rota Arrow (Continuous 24/7 Flow) -->
    <path d="M 28 -38 A 48 48 0 0 1 44 -12" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" />
    <polygon points="46,-7 41,-15 48,-14" fill="#e11d48" />
  </g>

  <!-- 3D Floating Pill 1: "24/7 ROTA" (Top Left) -->
  <g filter="url(#badgeShadow)" transform="translate(32, 38)">
    <rect width="80" height="28" rx="14" fill="url(#pill247)" />
    <!-- Subtle specular highlight -->
    <rect x="2" y="2" width="76" height="12" rx="6" fill="#ffffff" opacity="0.22" />
    <!-- Sun/Moon icon -->
    <circle cx="16" cy="14" r="5" fill="#fde047" />
    <text x="30" y="18" fill="#ffffff" font-size="10" font-weight="800" font-family="system-ui, -apple-system, sans-serif" letter-spacing="0.5">24/7 ROTA</text>
  </g>

  <!-- 3D Floating Pill 2: "SPLIT SHIFTS" (Bottom Right) -->
  <g filter="url(#badgeShadow)" transform="translate(162, 172)">
    <rect width="95" height="26" rx="13" fill="url(#pillSplit)" />
    <rect x="2" y="2" width="91" height="11" rx="5" fill="#ffffff" opacity="0.2" />
    <!-- Clock icon -->
    <circle cx="15" cy="13" r="4.5" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <polyline points="15,10.5 15,13 17,13" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    <text x="27" y="17" fill="#ffffff" font-size="9.5" font-weight="750" font-family="system-ui, -apple-system, sans-serif" letter-spacing="0.3">SPLIT SHIFTS</text>
  </g>

  <!-- Floating Shift A / Shift B indicator bubble (Top Right) -->
  <g filter="url(#badgeShadow)" transform="translate(196, 68)">
    <rect width="60" height="22" rx="11" fill="#ffffff" />
    <circle cx="12" cy="11" r="4" fill="#22c55e" />
    <text x="22" y="15" fill="#1f1838" font-size="9" font-weight="800" font-family="system-ui, -apple-system, sans-serif">Shift A</text>
  </g>
</svg>
